name: Robot Commercial - Routines automatiques

on:
  schedule:
    # Toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      routine:
        description: 'Routine a executer (morning, followup, weekly_audit)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - followup
          - weekly_audit
      configuration_only:
        description: 'Verifier uniquement la presence des secrets requis'
        required: false
        default: false
        type: boolean

concurrency:
  group: robot-commercial-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seule la branche par defaut peut executer et publier les routines.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: commercial-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check required configuration
        id: config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: bash check_config.sh

      - name: Setup Python
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        run: pip install -r requirements.txt

      - name: Determine routine
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        id: routine
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ROUTINE: ${{ inputs.routine }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            routine="$REQUESTED_ROUTINE"
          else
            HOUR=$(TZ='Europe/Paris' date +%H)
            DOW=$(TZ='Europe/Paris' date +%u)
            if [ "$DOW" = "5" ] && [ "$HOUR" -ge 16 ]; then
              routine=weekly_audit
            elif [ "$HOUR" -lt 12 ]; then
              routine=morning
            else
              routine=followup
            fi
          fi
          case "$routine" in
            morning|followup|weekly_audit) ;;
            *) echo "::error::Routine invalide."; exit 1 ;;
          esac
          printf 'name=%s\n' "$routine" >> "$GITHUB_OUTPUT"

      - name: Run robot routine
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_OWNER_NAME: Baptiste Thevenot
          AGENT_OWNER_EMAIL: bp.thevenot@gmail.com
          HUBSPOT_OWNER_ID: '80842560'
          ROUTINE: ${{ steps.routine.outputs.name }}
          TZ: Europe/Paris
        run: python autonomous.py "$ROUTINE"

      - name: Update website status
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          ROUTINE: ${{ steps.routine.outputs.name }}
          TZ: Europe/Paris
        run: python update_status.py "$ROUTINE"

      - name: Commit and push status update
        if: inputs.configuration_only != true && steps.config.outputs.config_ready == 'true'
        working-directory: .
        env:
          ROUTINE: ${{ steps.routine.outputs.name }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash commercial-agent/publish_status.sh "$ROUTINE"
